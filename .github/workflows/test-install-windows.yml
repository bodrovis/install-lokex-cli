name: Test install on Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: windows-latest

    steps:
      - name: Check out action repo
        uses: actions/checkout@v6

      - name: Install lokex-cli via local action
        id: install
        uses: ./

      - name: Show install outputs
        shell: pwsh
        run: |
          Write-Host "install-dir: ${{ steps.install.outputs.install-dir }}"
          Write-Host "bin-path:    ${{ steps.install.outputs.bin-path }}"

      - name: Verify installed binary by full path
        shell: pwsh
        run: |
          $bin = "${{ steps.install.outputs.bin-path }}"
          if (-not (Test-Path -LiteralPath $bin)) {
            throw "Binary not found: $bin"
          }
          & $bin version

      - name: Verify installed binary via PATH
        shell: pwsh
        run: |
          $cmd = Get-Command lokex-cli -ErrorAction Stop
          Write-Host "Resolved command: $($cmd.Source)"
          & lokex-cli version